[project]
name = "android-agent"
version = "0.1.0"
description = "Full-auto Android phone control agent with voice input, LLM decision layer, and accessibility service execution"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Agent Developer"}]
dependencies = [
    "faster-whisper>=1.0.0",
    "websockets>=12.0",
    "openai>=1.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "rich>=13.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
tts = ["pyttsx3>=2.90"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23.0", "ruff>=0.3.0"]

[project.scripts]
android-agent = "agent.main:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
