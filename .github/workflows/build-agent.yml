name: Build Agent (Windows EXE)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pyinstaller pyyaml pydantic pydantic-settings openai websockets uvicorn rich python-dotenv sounddevice numpy faster-whisper pywebview zeroconf ifaddr cryptography httpx

      - name: Build Windows EXE
        run: pyinstaller agent-desktop.spec --noconfirm

      - name: Upload EXE folder
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAgent
          path: dist/AndroidAgent/
